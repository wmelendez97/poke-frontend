services:
  frontend:
    container_name: pokeFrontend
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - 5173:5173
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - /app/node_modules
      - .:/app
    command: pnpm run dev
    depends_on:
      - api
    networks:
      - apt-network

networks:
  apt-network:
    driver: bridge
